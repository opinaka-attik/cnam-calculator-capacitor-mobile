# ================================================================
# docker-compose.android.yml
#
# Usage :
#   ./build-android.sh
#
# Volumes créés sur la machine hôte :
#   ./artifacts/     → APK généré  (cnam-calculator-debug.apk)
#   ./android-src/   → Code source Android/Kotlin généré par Capacitor
#                       (modifiable et enrichissable)
# ================================================================
version: '3.9'

services:

  # ----------------------------------------------------------------
  # Service principal : build Android + export APK + sources
  # ----------------------------------------------------------------
  android-builder:
    build:
      context: .
      dockerfile: Dockerfile.android
      target: output
    volumes:
      # Volume 1 : APK de sortie
      - ./artifacts:/artifacts

      # Volume 2 : Sources Android/Kotlin générées par Capacitor
      # Accéder ici pour enrichir le code natif :
      #   android-src/app/src/main/java/fr/cnam/calculator/MainActivity.kt
      #   android-src/app/src/main/AndroidManifest.xml
      #   android-src/app/src/main/res/  (icônes, splash, strings)
      - ./android-src:/android-src

    restart: 'no'
